[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-influencer"
version = "0.1.0"
description = "Self-hosted automation that runs an Instagram page for an AI character."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# Caption writing through the Claude API. Without it the template writer is used.
captions = ["anthropic>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
influencer = "influencer.cli:main"

[tool.setuptools.packages.find]
include = ["influencer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
